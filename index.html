<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>season1ぽたくCSランキング</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    color: #333;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  h1 {
    margin: 0;
    padding: 20px 0;
    font-size: 2.5em;
    color: #4a90e2;
    text-align: center;
    animation: dropIn 0.6s ease-out;
  }

  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  table {
    width: 90%;
    max-width: 800px;
    border-collapse: collapse;
    margin-top: 20px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    position: relative;
  }

  th, td {
    background-color: #fff;
    border: 2px solid #ddd;
    padding: 15px;
    text-align: center;
    width: 25%;
  }

  th {
    font-weight: bold;
    font-size: 1.1em;
  }

  /* --- 行の出現アニメーション --- */
  tbody tr {
    opacity: 0;
    transform: translateY(16px);
    animation: rowIn 0.5s ease forwards;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  @keyframes rowIn {
    to { opacity: 1; transform: translateY(0); }
  }

  tr:hover td {
    background-color: #f0f4f8;
    cursor: pointer;
  }

  tbody tr:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
    z-index: 2;
  }

  /* --- 上位ハイライト --- */
  tr.highlight-1 td {
    background: linear-gradient(90deg, #fff6d6, #ffe066, #fff6d6);
    background-size: 200% 100%;
    color: #7a5c00;
    font-weight: bold;
    font-size: 1.25em;
    animation: goldShine 2.4s linear infinite, glowPulse 1.8s ease-in-out infinite;
    position: relative;
  }

  tr.highlight-2 td {
    background-color: silver;
    color: black;
    font-weight: bold;
    font-size: 1.15em;
    animation: glowPulseSilver 2.2s ease-in-out infinite;
  }

  tr.highlight-3 td {
    background-color: #cd7f32;
    color: black;
    font-weight: bold;
    font-size: 1.1em;
  }

  @keyframes goldShine {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: inset 0 0 0 rgba(255, 215, 0, 0); }
    50% { box-shadow: inset 0 0 18px rgba(255, 215, 0, 0.6); }
  }

  @keyframes glowPulseSilver {
    0%, 100% { box-shadow: inset 0 0 0 rgba(220, 220, 220, 0); }
    50% { box-shadow: inset 0 0 12px rgba(220, 220, 220, 0.7); }
  }

  /* --- 1位の王冠 --- */
  .crown {
    display: inline-block;
    margin-right: 4px;
    animation: crownWiggle 1.6s ease-in-out infinite;
    transform-origin: bottom center;
  }

  @keyframes crownWiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }

  .points-value {
    display: inline-block;
    min-width: 2em;
  }

  @media (max-width: 600px) {
    th, td {
      padding: 10px;
      font-size: 0.9em;
    }
  }

  /* --- 紙吹雪 --- */
  #confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 10;
  }

  .confetti-piece {
    position: absolute;
    top: -10px;
    width: 8px;
    height: 14px;
    opacity: 0.9;
    animation: confettiFall linear forwards;
  }

  @keyframes confettiFall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0.3;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

<div id="confetti-layer"></div>

<h1>season1ぽたくCSランキング</h1>

<table id="rankingTable">
  <thead>
    <tr>
      <th>順位</th>
      <th>プレイヤー名</th>
      <th>X ID</th>
      <th>ポイント</th>
    </tr>
  </thead>
  <tbody>
    <tr><td colspan="4">読み込み中...</td></tr>
  </tbody>
</table>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTWSwzkWgJm5mVl1o2edBnhQ7I09BTIaPCVaIjVgQaZxCMPgVMopgQrx05taLfoVibAwC7hGDj6AJtg/pub?output=csv";

// 数値をカウントアップさせる
function animateCount(el, target, duration = 900) {
  const start = 0;
  const startTime = performance.now();
  function tick(now) {
    const progress = Math.min((now - startTime) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3); // ease-out
    const current = Math.round(start + (target - start) * eased);
    el.textContent = current;
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// 1位のお祝い紙吹雪
function launchConfetti() {
  const layer = document.getElementById("confetti-layer");
  const colors = ["#ffd700", "#ff6b6b", "#4a90e2", "#7ed957", "#ffb400"];
  const count = 60;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti-piece";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = 2.5 + Math.random() * 2 + "s";
    piece.style.animationDelay = Math.random() * 0.6 + "s";
    layer.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}

async function fetchRanking() {
  try {
    const response = await fetch(SHEET_URL);
    const text = await response.text();

    const rows = text.split("\n").map(row => row.split(","));
    const entries = rows.slice(1)
      .map(row => ({
        player: (row[0] || "").trim(),
        xid: (row[1] || "").trim(),
        points: Number(row[2])
      }))
      .filter(entry => entry.player); // 空行を除外

    const sortedEntries = entries.sort((a, b) => b.points - a.points);

    const tableBody = document.querySelector("#rankingTable tbody");
    tableBody.innerHTML = "";

    sortedEntries.forEach((entry, index) => {
      const row = document.createElement("tr");
      row.style.animationDelay = `${index * 0.08}s`;

      if (index === 0) row.classList.add("highlight-1");
      else if (index === 1) row.classList.add("highlight-2");
      else if (index === 2) row.classList.add("highlight-3");

      const crown = index === 0 ? `<span class="crown">👑</span>` : "";

      row.innerHTML = `
        <td>${crown}${index + 1}</td>
        <td>${entry.player}</td>
        <td>${entry.xid}</td>
        <td><span class="points-value">0</span></td>
      `;
      tableBody.appendChild(row);

      // 行が現れたタイミングでポイントをカウントアップ
      const pointsEl = row.querySelector(".points-value");
      setTimeout(() => {
        animateCount(pointsEl, entry.points || 0);
      }, index * 80 + 300);
    });

    if (sortedEntries.length > 0) {
      setTimeout(launchConfetti, sortedEntries.length * 80 + 200);
    }
  } catch (error) {
    console.error("データ取得に失敗しました:", error);
    const tableBody = document.querySelector("#rankingTable tbody");
    tableBody.innerHTML = `<tr><td colspan="4">エラー: データの取得に失敗しました。</td></tr>`;
  }
}

fetchRanking();
</script>

</body>
</html>
